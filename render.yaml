databases:
  - name: pinta-isla-db
    plan: free
    databaseName: pintaisla
    user: pintaisla

services:
  - type: web
    name: pinta-isla
    runtime: node
    plan: free
    buildCommand: npm run render-build
    startCommand: npm start --prefix server
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pinta-isla-db
          property: connectionString
      # Google Sign-In: both need the same OAuth Client ID (see README).
      # VITE_GOOGLE_CLIENT_ID must be set BEFORE the build runs, since Vite
      # bakes it into the built JS. Leave both blank to disable Google login.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
