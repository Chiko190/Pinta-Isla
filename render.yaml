databases:
  - name: pinta-isla-db
    plan: free
    databaseName: pintaisla
    user: pintaisla

services:
  - type: web
    name: pinta-isla
    runtime: node
    plan: free
    buildCommand: npm run render-build
    startCommand: npm start --prefix server
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pinta-isla-db
          property: connectionString
